<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, initial-scale=1.0">
<title>Slide</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@400;500;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #09090B; margin: 0; padding: 0; width: 100%; height: 100%; }
  body { display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  .slide { border: none; }

  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@400;500;700&display=swap');

  :root {
    --bg: #09090B;
    --fg: #FAFAFA;
    --acid: #DFE104;
    --acid-fg: #000000;
    --muted: #27272A;
    --muted-fg: #A1A1AA;
    --border: #3F3F46;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  

  .slide {
    width: 1080px; height: 1080px; background: var(--bg); color: var(--fg);
    font-family: 'Space Grotesk', 'Inter', sans-serif;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    text-align: center; padding: 80px 100px; position: relative; overflow: hidden;
    flex-shrink: 0; border: 1px solid var(--border);
  }

  /* ── Tipografia ── */
  .slide h1 { font-size: 82px; font-weight: 700; line-height: 0.92; letter-spacing: -0.03em; text-transform: uppercase; max-width: 860px; }
  .slide h1 span { color: var(--acid); }
  .slide h2 { font-size: 56px; font-weight: 700; line-height: 0.95; letter-spacing: -0.025em; max-width: 820px; }
  .slide h2 em { font-style: normal; color: var(--acid); }
  .slide p { font-size: 26px; font-weight: 400; line-height: 1.5; color: var(--muted-fg); max-width: 720px; }
  .slide p strong { color: var(--fg); font-weight: 600; }
  .slide .label {
    font-family: 'Geist Mono', monospace; font-size: 16px; font-weight: 600;
    letter-spacing: 0.12em; text-transform: uppercase; color: var(--acid); margin-bottom: 28px;
  }
  .slide .big-number {
    font-size: 200px; font-weight: 700; line-height: 0.8; letter-spacing: -0.04em;
    color: var(--muted); position: absolute; top: 50px; left: 80px; z-index: 0;
  }
  .slide .stat-tag {
    display: inline-block; font-family: 'Geist Mono', monospace; font-size: 28px; font-weight: 700;
    color: var(--acid); background: rgba(223,225,4,0.08); padding: 8px 28px; margin-top: 32px;
  }
  .slide .highlight-box {
    border: 2px solid var(--acid); padding: 28px 56px; margin-top: 36px;
  }
  .slide .highlight-box p { font-size: 26px; font-weight: 600; color: var(--acid); }
  .slide .source { position: absolute; bottom: 60px; left: 100px; font-size: 14px; color: var(--muted-fg); font-family: 'Inter', sans-serif; }
  .slide .page-num { position: absolute; top: 60px; right: 80px; font-family: 'Geist Mono', monospace; font-size: 16px; color: var(--muted-fg); letter-spacing: 0.05em; }
  .slide .divider { width: 120px; height: 2px; background: var(--acid); margin: 32px auto; }

  /* ── Slide 1: Hook ── */
  .s1 h1 { font-size: 78px; }

  /* ── CTA ── */
  .cta-slide h2 { font-size: 72px; }
  .cta-slide h2 span { color: var(--acid); }
  .cta-slide .reasons { display: flex; gap: 36px; margin-top: 40px; }
  .cta-slide .reason { text-align: center; }
  .cta-slide .reason .emoji { font-size: 44px; margin-bottom: 14px; }
  .cta-slide .reason p { font-size: 17px; max-width: 190px; }
  .cta-slide .handle { font-family: 'Geist Mono', monospace; font-size: 38px; font-weight: 600; color: var(--acid); letter-spacing: 0.03em; margin-top: 36px; }

  /* ── Bold quote ── */
  .quote-slide blockquote { font-size: 48px; font-weight: 600; line-height: 1.1; max-width: 800px; letter-spacing: -0.015em; }
  .quote-slide blockquote em { font-style: normal; color: var(--acid); }
  .quote-slide .attribution { font-size: 20px; color: var(--muted-fg); margin-top: 24px; }

</style>
</head>
<body>
<div class="slide cta-slide">
  <div class="page-num">12/12</div>
  <h2>Não perde<br>o <span>próximo</span>.</h2>
  <div class="divider"></div>
  <div class="reasons">
    <div class="reason"><div class="emoji">📊</div><p>Análise das notícias de IA todo santo dia</p></div>
    <div class="reason"><div class="emoji">🔍</div><p>Fontes verificadas, sem hype, sem bullshit</p></div>
    <div class="reason"><div class="emoji">🚀</div><p>Ferramentas e skills pra usar IA de verdade</p></div>
  </div>
  <div class="handle">@hernando.ia</div>
</div>
</body>
</html>
