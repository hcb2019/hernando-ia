<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, initial-scale=1.0">
<title>Slide</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@400;500;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #09090B; display: flex; justify-content: center; align-items: center; width: 1080px; height: 1080px; overflow: hidden; }
  .slide { border: none; }

  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@400;500;700&display=swap');

  :root {
    --bg: #09090B;
    --fg: #FAFAFA;
    --acid: #DFE104;
    --acid-fg: #000000;
    --muted: #27272A;
    --muted-fg: #A1A1AA;
    --border: #3F3F46;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #18181B;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 40px;
    padding: 40px 20px;
  }

  .slide {
    width: 1080px;
    height: 1080px;
    background: var(--bg);
    color: var(--fg);
    font-family: 'Space Grotesk', 'Inter', sans-serif;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 80px 100px;
    position: relative;
    overflow: hidden;
    flex-shrink: 0;
    border: 1px solid var(--border);
  }

  /* ═══════ SLIDE 1: HOOK ═══════ */
  .slide-1 .tag {
    font-family: 'Geist Mono', monospace;
    font-size: 18px;
    font-weight: 500;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--acid);
    border: 2px solid var(--acid);
    padding: 10px 28px;
    margin-bottom: 48px;
  }

  .slide-1 h1 {
    font-size: 88px;
    font-weight: 700;
    line-height: 0.92;
    letter-spacing: -0.03em;
    text-transform: uppercase;
    color: var(--fg);
    max-width: 860px;
  }

  .slide-1 h1 span { color: var(--acid); }

  .slide-1 .sub {
    font-size: 28px;
    font-weight: 400;
    color: var(--muted-fg);
    margin-top: 40px;
    max-width: 700px;
    line-height: 1.4;
  }

  .slide-1 .data {
    position: absolute;
    bottom: 60px;
    right: 100px;
    font-family: 'Geist Mono', monospace;
    font-size: 16px;
    color: var(--muted-fg);
    letter-spacing: 0.05em;
  }

  /* ═══════ SLIDES DE NOTÍCIA ═══════ */
  .slide-news .number {
    font-size: 160px;
    font-weight: 700;
    line-height: 0.8;
    letter-spacing: -0.04em;
    color: var(--muted);
    position: absolute;
    top: 60px;
    left: 80px;
    z-index: 0;
  }

  .slide-news .content {
    position: relative;
    z-index: 1;
    max-width: 800px;
  }

  .slide-news .label {
    font-family: 'Geist Mono', monospace;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--acid);
    margin-bottom: 32px;
  }

  .slide-news h2 {
    font-size: 58px;
    font-weight: 700;
    line-height: 0.95;
    letter-spacing: -0.025em;
    margin-bottom: 32px;
  }

  .slide-news h2 em {
    font-style: normal;
    color: var(--acid);
  }

  .slide-news p {
    font-size: 24px;
    font-weight: 400;
    line-height: 1.55;
    color: var(--muted-fg);
    max-width: 680px;
    margin: 0 auto;
  }

  .slide-news .stat {
    display: inline-block;
    font-family: 'Geist Mono', monospace;
    font-size: 28px;
    font-weight: 700;
    color: var(--acid);
    background: rgba(223, 225, 4, 0.08);
    padding: 6px 24px;
    margin-top: 28px;
  }

  .slide-news .source {
    position: absolute;
    bottom: 60px;
    left: 100px;
    font-size: 14px;
    color: var(--muted-fg);
    font-family: 'Inter', sans-serif;
  }

  /* ═══════ SLIDE CTA BLOG ═══════ */
  .slide-cta-blog .icon-row {
    display: flex;
    gap: 20px;
    margin-bottom: 48px;
  }

  .slide-cta-blog .icon-box {
    width: 80px;
    height: 80px;
    border: 2px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
  }

  .slide-cta-blog h2 {
    font-size: 64px;
    font-weight: 700;
    line-height: 0.95;
    letter-spacing: -0.025em;
    max-width: 820px;
    margin-bottom: 28px;
  }

  .slide-cta-blog h2 span { color: var(--acid); }

  .slide-cta-blog .highlight-box {
    border: 2px solid var(--acid);
    padding: 28px 56px;
    margin-top: 36px;
  }

  .slide-cta-blog .highlight-box p {
    font-size: 26px;
    font-weight: 600;
    color: var(--acid);
    letter-spacing: 0.02em;
  }

  .slide-cta-blog .url {
    position: absolute;
    bottom: 60px;
    font-size: 20px;
    font-weight: 500;
    color: var(--muted-fg);
    letter-spacing: 0.03em;
  }

  /* ═══════ SLIDE CTA SEGUIR ═══════ */
  .slide-follow h2 {
    font-size: 88px;
    font-weight: 700;
    line-height: 0.9;
    letter-spacing: -0.03em;
    text-transform: uppercase;
    margin-bottom: 24px;
  }

  .slide-follow h2 span { color: var(--acid); }

  .slide-follow .handle {
    font-family: 'Geist Mono', monospace;
    font-size: 42px;
    font-weight: 600;
    color: var(--acid);
    letter-spacing: 0.03em;
    margin-bottom: 48px;
  }

  .slide-follow .reasons {
    display: flex;
    gap: 40px;
  }

  .slide-follow .reason {
    text-align: center;
  }

  .slide-follow .reason .emoji {
    font-size: 48px;
    margin-bottom: 16px;
  }

  .slide-follow .reason p {
    font-size: 18px;
    font-weight: 500;
    color: var(--muted-fg);
    line-height: 1.3;
    max-width: 200px;
  }

  .slide-follow .divider {
    width: 120px;
    height: 2px;
    background: var(--acid);
    margin: 0 auto 48px;
  }

</style>
</head>
<body>
<div class="slide slide-follow">
  <h2>Não perde<br>o <span>próximo</span>.</h2>
  <div class="divider"></div>
  <div class="reasons">
    <div class="reason">
      <div class="emoji">📊</div>
      <p>Análise das notícias de IA todo santo dia</p>
    </div>
    <div class="reason">
      <div class="emoji">🔍</div>
      <p>Fontes verificadas, sem hype, sem bullshit</p>
    </div>
    <div class="reason">
      <div class="emoji">🚀</div>
      <p>Ferramentas e skills pra você usar IA de verdade</p>
    </div>
  </div>
  <div class="divider" style="margin-top:48px;"></div>
  <div class="handle">@hernando.ia</div>
</div>
</body>
</html>
